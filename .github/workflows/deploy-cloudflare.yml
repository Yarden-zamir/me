name: Deploy site to Cloudflare

# Replaces the Netlify build. The build steps mirror netlify.toml [build].
# Site settings stay in netlify.toml [build.environment], read by obsidian-zola-plus env.py.
# kitshn 2 deploys the built site to www.yarden-zamir.com and the CV to cv.yarden-zamir.com (two apps, K-804).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # kitshn 2 agent keys start a build of one branch (K-718).
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SITE_REPO: https://github.com/Yarden-zamir/obsidian-zola-plus.git
  SITE_BRANCH: remove_landing_button

jobs:
  build:
    # The closing of a pull request builds nothing; the kitshn job still removes its preview.
    if: github.event.action != 'closed'
    # Python 3.8 (PYTHON_VERSION in netlify.toml) is not available on ubuntu-24.04 runners.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: __obsidian

      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Install zola from ZOLA_VERSION in netlify.toml
        run: |
          pip install rtoml==0.11.0  # newest release with a Python 3.8 wheel
          ZOLA_VERSION=$(python -c 'import rtoml; print(rtoml.load(open("__obsidian/netlify.toml"))["build"]["environment"]["ZOLA_VERSION"])')
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build site
        run: |
          git clone --depth 1 -b "$SITE_BRANCH" "$SITE_REPO" __site
          VAULT=__obsidian python __site/env.py
          test -s env.sh
          source env.sh
          __site/run.sh
          test -f public/index.html

      - name: Add redirects (ported from netlify.toml [[redirects]])
        run: |
          cat > public/_redirects <<'REDIRECTS'
          /github https://github.com/Yarden-zamir 301
          /github/* https://github.com/Yarden-zamir 301
          /git/* https://github.com/Yarden-zamir/me/:splat 301
          REDIRECTS

      - uses: actions/upload-artifact@v7
        with:
          name: public
          path: public
          retention-days: 7

  kitshn:
    needs: build
    if: ${{ !cancelled() && !failure() }}
    uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
    with:
      artifact: public
      artifact-path: public
    secrets: inherit
